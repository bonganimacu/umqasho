services:
  postgres:
    image: postgres:16-alpine
    container_name: uqasho-postgres
    environment:
      POSTGRES_DB: umqasho_db
      POSTGRES_USER: uqasho
      POSTGRES_PASSWORD: uqasho
    ports:
      - "5432:5432"
    volumes:
      - uqasho-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uqasho -d umqasho_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uqasho-postgres-data:
